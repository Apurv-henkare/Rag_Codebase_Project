<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("ball-dash-theme");
          if (t !== "light" && t !== "dark" && t !== "hud") {
            t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
    <title>What players love and hate about ball games</title>
    <meta name="description" content="790,541 store reviews of 1,702 ball games, from Nokia's Bounce to Geometry Dash: what players praise, what they complain about, where they play and what the games earn." />
